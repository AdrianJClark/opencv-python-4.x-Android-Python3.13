[build-system]
requires = [
  "numpy<2.0; python_version<'3.9'",
  "numpy==2.0.2; python_version>='3.9' and python_version<'3.13'",
  "numpy==2.3.2; python_version=='3.13'",
  "numpy==2.3.2; python_version=='3.14'",
  "packaging",
  "pip",
  "scikit-build>=0.14.0",
  "setuptools==59.2.0; python_version<'3.12'",
  "setuptools<70.0.0; python_version>='3.12'",
]
# use a custom backend to manage CMake check / installation
# see https://scikit-build.readthedocs.io/en/latest/usage.html#adding-cmake-as-building-requirement-only-if-not-installed-or-too-low-a-version
build-backend = "backend"
backend-path = ["_build_backend"]

[tool.cibuildwheel.android]
before-build = "sed -i '' -e 's/NOT ANDROID AND NOT APPLE_FRAMEWORK)/NOT APPLE_FRAMEWORK) # AND NOT ANDROID/g' opencv/cmake/OpenCVDetectPython.cmake ; sed -i '' -e 's/ANDROID OR APPLE_FRAMEWORK OR WINRT)/APPLE_FRAMEWORK OR WINRT) # OR ANDROID/g' opencv/modules/python/CMakeLists.txt"

[tool.cibuildwheel]
build = "cp313-android_*"

[tool.cibuildwheel.android.environment]
PIP_EXTRA_INDEX_URL = "https://chaquo.com/pypi-upstream/"
